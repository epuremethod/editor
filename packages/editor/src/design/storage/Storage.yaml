feature: Storage
background:
  given: a stored section
examples:
  - scenario: plain text reads into a block and writes back as it was
    blocks:
      - A topology on a set X is a collection of subsets called open sets.
      - The empty set and X itself are open.

  - scenario: every mark reads and writes back in its one form
    blocks:
      - "**Every** open ball is an _open_ set."
      - "**_Compact_** subsets of a Hausdorff space are closed."
      - "See [compactness](/compactness) for the finite subcover property."
      - "[**_Heine–Borel_**](/heine-borel) gives the compact subsets of the line."
      - "The set `U` is open in X."

  - scenario: a delimiter inside a code span is text
    blocks:
      - "A code span keeps its stars: `a * b` and `**x**`."

  - scenario: a literal delimiter keeps its backslash
    blocks:
      - "A literal \\*star\\* and a literal \\_underscore\\_."
      - "Brackets in a link: [the \\[open\\] sets](/open-sets)."
      - "A parenthesis in an href: [a](/a\\)b)."

  - scenario: the markers of the notation are text on the port
    blocks:
      - "A pipe | and braces {x} are text here."

  - scenario: an empty block is an empty line
    blocks:
      - "Every metric space is Hausdorff."
      - ""
      - "The converse fails."

  - scenario: two bold runs parted by a space become one
    blocks:
      - "**Open** **sets** are closed under unions."
    canonical:
      - "**Open sets** are closed under unions."

  - scenario: a space inside the edge of a bold run steps out of it
    blocks:
      - "**Open ** sets are closed under unions."
    canonical:
      - "**Open**  sets are closed under unions."

  - scenario: a heading and an item keep their prefixes
    blocks:
      - "# Open sets"
      - "## Examples"
      - "- Every open ball is open."
      - "A **topology** is a collection of open sets."

  - scenario: a line that would read as a prefix keeps its backslash
    blocks:
      - "\\# not a heading"
      - "\\- not an item"
      - "#hashtags and -dashes need none"

  - scenario: an edit hands the section back whole, with its ids and no caret
    given: an editor over a section
    before: |
      @a A set is **closed|** when its complement is open.
      @b Both the empty set and X are closed.
    when: "input(A set is closed sets| when its complement is open.)"
    update: |
      @a A set is **closed sets** when its complement is open.
      @b Both the empty set and X are closed.

  - scenario: a split hands back the new block with its minted id
    given: an editor over a section
    before: |
      @a A map f from X to Y is continuous when| the preimage of every open set is open.
    when: enter
    update: |
      @a A map f from X to Y is continuous when
      @b the preimage of every open set is open.

  - scenario: a reference reads into a mark and writes back as it was
    entries:
      a8f1: |-
        math
        U \in \tau
    blocks:
      - "A set {{a8f1}} is open by definition."

  - scenario: one entry is drawn inline in a sentence and as a display block from one text
    entries:
      a8f1: |-
        math
        \emptyset \in \tau \quad\text{and}\quad X \in \tau
    blocks:
      - "The pair {{a8f1}} is the first axiom."
      - ":: {{a8f1}}"

  - scenario: an entry keeps its newlines, and its type is its first line
    entries:
      a8f1: |-
        math
        \begin{aligned}
        \emptyset &\in \tau \\
        X &\in \tau
        \end{aligned}
    blocks:
      - ":: {{a8f1}}"

  - scenario: a literal double brace keeps its backslash
    blocks:
      - "A template opens with \\{{ and closes with }}."

  - scenario: a double brace inside a code span is text
    blocks:
      - "Write `{{a8f1}}` to name an entry."

  - scenario: a reference to an entry the section does not hold is still a reference
    blocks:
      - "See {{zz99}} for the proof."

  - scenario: an entry the host holds is on the port and never in a block
    entries:
      a8f1: |-
        math
        U \in \tau
      b2c3: |-
        video
        {"row": "0f3a9c1e2b4d6a7f", "width": "wide"}
    blocks:
      - "A set {{a8f1}} is open by definition."
      - ":: {{b2c3}}"

  - scenario: an entry with no source is its type and a newline
    entries:
      a8f1: |-
        math
    blocks:
      - "An empty formula {{a8f1}} draws nothing yet."
    canonicalEntries:
      a8f1: "math\n"

  - scenario: an edit of an entry hands the section back with its entries
    given: an editor over a section
    entries:
      a8f1: |-
        math
        U \in \tau
    before: |
      @a A set {{a8f1}}| is open by definition.
    when: 'edit(a8f1, U \subseteq X)'
    update: |
      @a A set {{a8f1}} is open by definition.
    entriesAfter:
      a8f1: |-
        math
        U \subseteq X

  - scenario: removing a reference hands the section back with the entry still in it
    given: an editor over a section
    entries:
      a8f1: |-
        math
        U \in \tau
    before: |
      @a A set {{{a8f1}}} is open by definition.
    when: backspace
    update: |
      @a A set  is open by definition.
    entriesAfter:
      a8f1: |-
        math
        U \in \tau
