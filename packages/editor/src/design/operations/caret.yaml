feature: Caret
background:
  given: an editor
examples:
  - scenario: right moves the caret one character
    before: |
      Every |open set is a union of basis members.
    when: ->
    after: |
      Every o|pen set is a union of basis members.

  - scenario: left moves the caret one character back
    before: |
      Every o|pen set is a union of basis members.
    when: <-
    after: |
      Every |open set is a union of basis members.

  - scenario: right at the end of a block moves to the start of the next one
    before: |
      @a A set is closed when its complement is open.|
      @b Both the empty set and X are closed.
    when: ->
    after: |
      @a A set is closed when its complement is open.
      @b |Both the empty set and X are closed.

  - scenario: left at the start of a block moves to the end of the previous one
    before: |
      @a A set is closed when its complement is open.
      @b |Both the empty set and X are closed.
    when: <-
    after: |
      @a A set is closed when its complement is open.|
      @b Both the empty set and X are closed.

  - scenario: right at the end of the last block changes nothing
    before: |
      The closure of A is the smallest closed set containing A.|
    when: ->
    after: |
      The closure of A is the smallest closed set containing A.|

  - scenario: right at the end of a run moves on, and the caret lands plain
    before: |
      An **open|** cover of X is a family of open sets.
    when: ->
    after: |
      An **open** |cover of X is a family of open sets.

  - scenario: right to the end of a run lands inside it
    before: |
      An **ope|n** cover of X is a family of open sets.
    when: ->
    after: |
      An **open|** cover of X is a family of open sets.

  - scenario: right into a run lands inside it
    before: |
      Every |**open** set is a union of basis members.
    when: ->
    after: |
      Every **o|pen** set is a union of basis members.

  - scenario: left from after a run lands inside it
    before: |
      An **open** |cover of X is a family of open sets.
    when: <-
    after: |
      An **open|** cover of X is a family of open sets.

  - scenario: right to the end of a link lands outside it
    before: |
      See [compactnes|s](/compactness) for the finite subcover property.
    when: ->
    after: |
      See [compactness](/compactness)| for the finite subcover property.

  - scenario: typing with bold toggled off at the end of a run is not marked
    before: |
      An **open|** cover of X is a family of open sets.
    when: [bold, input(An opens| cover of X is a family of open sets.)]
    after: |
      An **open**s| cover of X is a family of open sets.

  - scenario: backspace from outside a run deletes its last letter and lands inside
    before: |
      An **open**| cover of X is a family of open sets.
    when: backspace
    after: |
      An **ope|** cover of X is a family of open sets.

  - scenario: backspace inside a block deletes the character before the caret
    before: |
      Every open ball is an| open set.
    when: backspace
    after: |
      Every open ball is a| open set.

  - scenario: a caret placed at the end of a bold run is inside it
    before: |
      An **open** cover of X is a family of open sets.
    when: click(An open| cover of X is a family of open sets.)
    after: |
      An **open|** cover of X is a family of open sets.

  - scenario: a caret placed at the end of a link is outside it
    before: |
      The proof uses the [Heine–Borel theorem](/heine-borel) twice.
    when: click(The proof uses the Heine–Borel theorem| twice.)
    after: |
      The proof uses the [Heine–Borel theorem](/heine-borel)| twice.

  - scenario: a caret placed at the start of a run is outside it
    before: |
      Every **open** set is a union of basis members.
    when: click(Every |open set is a union of basis members.)
    after: |
      Every |**open** set is a union of basis members.
